name: Release on DockerHub

# This CD workflow builds and push a docker image of the RiseClipse Validator SCL CLI tool
# with a specific version

on:
    workflow_dispatch:

env:
    RELEASE_VERSION: 1.3.1-SNAPSHOT
    DOCKER_REPOSITORY: riseclipse-validator-scl
    DOCKER_PRE_TAG: iec61850-6-3-v

jobs:
  release-dockerhub-workflow:
    # Use a specific version to avoid unattended changes with latest
    runs-on: ubuntu-24.04

    steps: 
    - name: Checkout ${{ github.event.repository.name }}
      uses: actions/checkout@v6

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.RISECLIPSE_DOCKER_USERNAME }}
        password: ${{ secrets.RISECLIPSE_DOCKER_ACCESS_TOKEN }}

    - name: Build and push Docker image with given tag
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        build-args: RELEASE_VERSION=${{ env.RELEASE_VERSION }}
        tags: riseclipse/${{ env.DOCKER_REPOSITORY }}:${{ env.DOCKER_PRE_TAG }}${{ env.RELEASE_VERSION }}
    
    - name: Send email about this new development version
      uses: dawidd6/action-send-mail@v15
      with:
        server_address: smtp.gmail.com
        # Server port, default 25:
        server_port: 465
        # Optional whether this connection use TLS (default is true if server_port is 465)
        secure: true
        # Optional (recommended) mail server username:
        username: ${{ secrets.MAIL_USERNAME }}
        # Optional (recommended) mail server password:
        password: ${{ secrets.MAIL_PASSWORD }}
        # Required mail subject:
        subject: New development version of docker image of ${{ env.DOCKER_REPOSITORY }}
        # Required recipients' addresses:
        to: dominique.marcadet@centralesupelec.fr, aurelie.dehouck-neveu@edf.fr
        # Required sender full name (address can be skipped):
        from: riseclipse@gmail.com
        # Optional plain body:
        body: |
            Hi,
            
            A new development version of the image is available at https://hub.docker.com/r/riseclipse/riseclipse-validator-scl/tags.
            See changes at https://github.com/riseclipse/${{ github.event.repository.name }}/blob/develop/CHANGELOG.md
            
            ----
            The RiseClipse Team (https://riseclipse.github.io/)

